# Continuous integration.
#
# Scope is deliberately narrow: the checks that would have caught a real defect
# in this repository, and nothing else. Two independent jobs, because a CSS
# change should not wait on a 350-test Python suite to report.
#
# `data/f1.db` is not committed -- it is a build artefact of results.csv, which
# is. CI therefore rebuilds it, which also means the build itself is tested on
# every push rather than only when someone remembers to run it.
#
# Nothing here needs a secret. The Supabase tests skip themselves when
# SUPABASE_URL / SUPABASE_ANON_KEY are absent, so CI exercises the SQLite leg
# and never needs a key. Do not add one: a fork's pull request would then run
# with credentials attached.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, tests, data audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Not -r requirements.txt: that pulls fastf1, which drags in pandas and
      # scipy to run no test at all. This is the subset the suite actually
      # imports, which is not the same as the subset the API imports --
      # test_laps_and_sessions reaches backend.etl.jolpica (requests) and
      # test_store_parity imports psycopg directly. Leaving those two out is
      # what failed CI #1 and #2: pytest exits 2 on a collection error, which
      # reads as a crash rather than as a missing dependency.
      #
      # Verified in a clean venv holding exactly this list and nothing else:
      # 244 passed, 138 skipped, and fastf1 still absent.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110" "pydantic>=2.6" "pytest>=8.0" "httpx>=0.27"                       "uvicorn[standard]>=0.27" "requests>=2.31" "psycopg[binary]>=3.1"

      - name: Build the database from the committed CSV
        run: python -m backend.etl.build

      - name: Tests
        run: python -m pytest backend/tests -q

      # Structural integrity of the database that came out, not the CSV that
      # went in. Exits non-zero on a failed check; warnings do not fail.
      - name: Data integrity audit
        run: python -m backend.etl.audit

      # The migration history must still describe the schema it claims to.
      - name: Migration checksums
        run: python supabase/verify_migrations.py

  frontend:
    name: Frontend — types, tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # `tsc -b && vite build`. Kept last: it is the slowest step and the one
      # most likely to be made redundant by an earlier failure.
      - name: Production build
        run: npm run build
